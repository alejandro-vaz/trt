on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: write
jobs:
  install:
    if: github.repository == 'trtlang/trt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v7
        with:
          name: install
          path: ./install.sh
  macos:
    if: github.repository == 'trtlang/trt'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo build
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: target/release/trt
  release:
    needs: [install, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: downloads/*
