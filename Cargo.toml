[package]
name = "trt"
edition = "2024"
default-run = "trt"
repository = "https://github.com/trtlang/trt"
description = "the TRT language"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
authors = ["Alejandro Vaz <alejandro.vaz.myt@gmail.com>"]

[lints.rust]
unused = "deny"
deprecated = "deny"
unreachable_code = "deny"
nonstandard_style = "deny"
warnings = "deny"
missing_debug_implementations = "deny"
dropping_copy_types = "deny"
dropping_references = "deny"
elided_lifetimes_in_paths = "deny"
explicit_builtin_cfgs_in_flags = "deny"
forgetting_copy_types = "deny"
forgetting_references = "deny"
impl_trait_redundant_captures = "deny"
invalid_doc_attributes = "deny"
irrefutable_let_patterns = "deny"
macro_use_extern_crate = "deny"
missing_copy_implementations = "deny"
mutable_transmutes = "deny"
noop_method_call = "deny"
opaque_hidden_inferred_bound = "deny"
overflowing_literals = "deny"
redundant_imports = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
unknown_lints = "deny"
arithmetic_overflow = "deny"
missing_docs = "deny"
type_alias_bounds = "deny"

[lints.clippy]
all = "deny"

[lints.rustdoc]
all = "deny"

[lints.cargo]
unknown_lints = "deny"
unused_dependencies = "deny"
non_kebab_case_features = "deny"

[profile.release]
lto = "fat"
opt-level = 3
strip = true
debug = false
codegen-units = 1
incremental = false

[dependencies]
anyhow = { version = "1.0.104", default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", default-features = false, features = [
  "color",
  "derive",
  "error-context",
  "help",
  "std",
  "suggestions",
  "usage",
  "wrap_help",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "rustls",
  "system-proxy",
] }
self-replace = "1.5.1"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
tempfile = { version = "3.27.0", default-features = false, features = [
  "getrandom",
] }
termimad = { version = "0.35.5", default-features = false }
toml = { version = "1.2.1", features = [
  "parse",
  "serde",
  "std",
], default-features = false }

[build-dependencies]
built = { version = "0.8.1", default-features = false, features = ["gix"] }
